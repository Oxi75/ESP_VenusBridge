; VenusBridge – Marstek Venus E (Mini) <-> homee
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32c3-supermini

[common]
build_flags =
    -DVB_VERSION=\"0.09\"
lib_deps_common =
    https://github.com/Oxi75/homee-api-esp32.git#v10.1.0   ; exactly this version, not newer
    bblanchon/ArduinoJson@^7.4.3

; ESP8266 ESP-12E: LED on GPIO16 (active low), configuration button GPIO12 -> GND.
; Prepared but NOT tested yet.
[env:esp12e]
platform = platformio/espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
    ${common.build_flags}
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVB_LED_PIN=16
    -DVB_LED_ACTIVE_LOW=1
    -DVB_CONFIG_PIN=12
    -DVB_CONFIG_PIN_AT_BOOT=1
lib_deps =
    ${common.lib_deps_common}
    ESP32Async/ESPAsyncWebServer@^3.11.0
    ESP32Async/ESPAsyncTCP@^2.0.0   ; latest available version (the ^3.1.5 from the fork's library.json does not exist)
    https://github.com/DanielKnoop/ESPAsyncUDP   ; fork with AsyncUDPPacket::readString(), required by homee-api-esp32 v10.1.0
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; Upload via WiFi: pio run -e esp12e-ota -t upload
; (upload_port = hostname from the settings or IP address of the bridge)
[env:esp12e-ota]
extends = env:esp12e
upload_protocol = espota
upload_port = venusbridge.local
; required if an admin password is set in the settings:
; upload_flags = --auth=<admin password>

; ESP32-C3 SuperMini: LED on GPIO8 (active low), BOOT button on GPIO9
; (strapping pin -> configuration mode via long press during operation).
; Tasmota platform (Arduino core 3.1.4).
; Board definition lolin_c3_mini (same chip), because it knows the USB ID 303A:1001
; so PlatformIO finds the port automatically. If the wrong port is still used:
; set upload_port / monitor_port = COMx.
[env:esp32c3-supermini]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2025.10.30/platform-espressif32.zip
board = lolin_c3_mini
framework = arduino
upload_speed = 921600
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DVB_LED_PIN=8
    -DVB_LED_ACTIVE_LOW=1
    -DVB_CONFIG_PIN=9
    -DVB_WIFI_TX_POWER=WIFI_POWER_8_5dBm
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    ${common.lib_deps_common}
    ESP32Async/ESPAsyncWebServer@^3.11.0
    ESP32Async/AsyncTCP@^3.4.10
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; Upload via WiFi: pio run -e esp32c3-supermini-ota -t upload
[env:esp32c3-supermini-ota]
extends = env:esp32c3-supermini
upload_protocol = espota
upload_port = venusbridge.local
; required if an admin password is set in the settings:
; upload_flags = --auth=<admin password>
